apiVersion: v2
name: m8b-stack
description: MetricsHub Enterprise, Prometheus, SearXNG and the M8B Slack bot, installed in explicit stages
type: application
version: 2.0.0
appVersion: 3.0.1
kubeVersion: '>=1.27.0-0'
home: https://metricshub.com
icon: https://metricshub.com/images/logo.svg
sources:
  - https://github.com/metricshub/helm-charts
keywords:
  - metricshub
  - m8b
  - slack
  - prometheus
  - otlp
  - observability
maintainers:
  - name: MetricsHub
    url: https://metricshub.com
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/changes: |
    - kind: changed
      description: MetricsHub Enterprise image with its embedded OpenTelemetry Collector
    - kind: changed
      description: Resource names derive from the release (fullname) with standard Kubernetes labels
    - kind: added
      description: Render-time check of monitoring CIDRs against cluster Pod/Service ranges
    - kind: fixed
      description: Re-running the check or index stage no longer fails on an immutable Job
