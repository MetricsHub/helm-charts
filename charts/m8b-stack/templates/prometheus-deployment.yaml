{{- $n := include "stack.names" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n.prometheus | quote }}
  labels:
{{ include "stack.labels" (dict "root" . "component" "prometheus" "role" "prometheus") | indent 4 }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
{{ include "stack.selectorLabels" (dict "root" . "component" "prometheus") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "stack.labels" (dict "root" . "component" "prometheus" "role" "prometheus") | indent 8 }}
      annotations:
        checksum/stack-config: {{ include "stack.componentHash" (dict "root" . "component" "prometheus") | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: check-config
          image: {{ .Values.images.prometheus | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - /bin/promtool
            - check
            - config
            - /etc/prometheus/prometheus.yml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
{{ toYaml .Values.prometheus.initResources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: prometheus
          image: {{ .Values.images.prometheus | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - {{ printf "--storage.tsdb.retention.time=%s" .Values.prometheus.retentionTime | quote }}
            - {{ printf "--storage.tsdb.retention.size=%s" .Values.prometheus.retentionSize | quote }}
            - --web.listen-address=0.0.0.0:9090
            - --web.enable-otlp-receiver
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 9090
          resources:
{{ toYaml .Values.prometheus.resources | indent 12 }}
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
{{ with .Values.prometheus.extraEnv }}
          env:
{{ toYaml . | indent 12 }}
{{ end }}
      volumes:
        - name: config
          configMap:
            name: {{ $n.prometheusConfig | quote }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $n.prometheusClaim | quote }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
{{ include "stack.placement" (dict "root" . "component" "prometheus" "pvc" true) | indent 6 }}
