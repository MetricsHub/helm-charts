{{- $n := include "stack.names" . | fromYaml }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $n.prometheus | quote }}
  labels:
{{ include "stack.labels" (dict "root" . "component" "prometheus") | indent 4 }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  type: ClusterIP
  selector:
{{ include "stack.selectorLabels" (dict "root" . "component" "prometheus") | indent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
