{{- if and .Values.network.enabled (eq .Values.network.provider "kubernetes")  }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-m8b-traffic" (include "stack.fullname" .) | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "stack.labels" (dict "root" . "component" "network") | indent 4 }}
spec:
  podSelector:
{{ include "stack.endpoint" (dict "root" . "role" "m8b") | indent 4 }}
  policyTypes:
    - Egress
  egress:
{{ include "stack.kubeDns" . | indent 4 }}
    - to:
        - podSelector:
            matchLabels:
              m8b-stack.io/network-role: agent
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - port: 31888
          protocol: TCP
{{ include "stack.kubeCidrEgress" .Values.m8b.ai.egress | indent 4 }}
{{ include "stack.kubeCidrEgress" .Values.m8b.embeddings.egress | indent 4 }}
{{ include "stack.kubePodEgress" .Values.m8b.ai.podEgress | indent 4 }}
{{ include "stack.kubePodEgress" .Values.m8b.embeddings.podEgress | indent 4 }}
{{ include "stack.kubePublicEgress" (dict "root" . "ports" (list (dict "port" "443" "protocol" "TCP"))) | indent 4 }}
{{ if .Values.m8b.enablePromql }}
    - to:
        - podSelector:
            matchLabels:
              m8b-stack.io/network-role: prometheus
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - port: 9090
          protocol: TCP
{{ end }}
{{ if .Values.searxng.enabled }}
    - to:
        - podSelector:
            matchLabels:
              m8b-stack.io/network-role: searxng
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - port: 8080
          protocol: TCP
{{ end }}
{{ include "stack.kubeCidrEgress" .Values.network.m8bAdditionalEgress | indent 4 }}
{{- end }}
