{{- if .Values.searxng.enabled }}
{{- $n := include "stack.names" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n.searxng | quote }}
  labels:
{{ include "stack.labels" (dict "root" . "component" "searxng" "role" "searxng") | indent 4 }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
{{ include "stack.selectorLabels" (dict "root" . "component" "searxng") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "stack.labels" (dict "root" . "component" "searxng" "role" "searxng") | indent 8 }}
      annotations:
        checksum/stack-config: {{ include "stack.componentHash" (dict "root" . "component" "searxng") | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: {{ .Values.images.searxng | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.searxng | quote }}
                  key: SEARXNG_SECRET
            - name: FORCE_OWNERSHIP
              value: 'false'
{{ with .Values.searxng.extraEnv }}
{{ toYaml . | indent 12 }}
{{ end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
{{ if .Values.searxng.fixCacheOwnership }}
              add:
                - DAC_OVERRIDE
{{ end }}
          resources:
{{ toYaml .Values.searxng.resources | indent 12 }}
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
      volumes:
        - name: settings
          configMap:
            name: {{ $n.searxngConfig | quote }}
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.searxng.cacheSize | quote }}
{{ include "stack.placement" (dict "root" . "component" "searxng" "pvc" false) | indent 6 }}
{{ if .Values.searxng.fixCacheOwnership }}
      initContainers:
        - name: cache-owner
          image: {{ .Values.images.searxng | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
{{ .Files.Get "files/scripts/cache-owner.sh" | trimSuffix "\n" | indent 14 }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          resources:
{{ toYaml .Values.searxng.initResources | indent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /cache
{{ end }}
{{- end }}
