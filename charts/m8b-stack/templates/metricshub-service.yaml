{{- $n := include "stack.names" . | fromYaml -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $n.agent | quote }}
  labels:
{{ include "stack.labels" (dict "root" . "component" "metricshub") | indent 4 }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  type: ClusterIP
  selector:
{{ include "stack.selectorLabels" (dict "root" . "component" "metricshub") | indent 4 }}
  ports:
    - name: https
      port: 31888
      targetPort: https
      protocol: TCP
    - name: otel-health
      port: 13133
      targetPort: otel-health
      protocol: TCP
    - name: otel-prom
      port: 24375
      targetPort: otel-prom
      protocol: TCP
