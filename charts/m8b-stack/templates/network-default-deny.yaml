{{- if .Values.network.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-default-deny" (include "stack.fullname" .) | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "stack.labels" (dict "root" . "component" "network") | indent 4 }}
spec:
{{ if .Values.network.defaultDenyWholeNamespace }}
  podSelector: {}
{{ else }}
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: m8b-stack
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
{{ end }}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
